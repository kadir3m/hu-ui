<!-- Varsayılan hu-shell: üst bant + kart sidebar + topbar'da menü ikonu (ek ayar gerekmez) -->
<hu-shell [nav]="nav" brand="@ucme-ui/angular" brandSubtitle="Dokümantasyon">
  <div huTopbarEnd>
    <div class="hu-topbar-search">
      <hu-icon name="search" [size]="16" />
      <input huInput size="sm" type="search" placeholder="Ara…" aria-label="Uygulamada ara" />
      <kbd>Ctrl K</kbd>
    </div>

    <hu-dropdown align="end" ariaLabel="Kullanıcı menüsü" [options]="userMenu()" (selected)="onUserMenu($event)">
      <button huDropdownTrigger type="button" class="hu-topbar-user" aria-label="Kullanıcı menüsü">
        <hu-avatar [name]="user.name" size="sm" />
        <span class="hu-topbar-user__text">
          <span class="hu-topbar-user__name">{{ user.name }}</span>
          <span class="hu-topbar-user__role">{{ user.role }}</span>
        </span>
        <hu-icon name="chevron-down" [size]="16" />
      </button>
    </hu-dropdown>
  </div>

  <!-- Breadcrumb şimdilik gizli. Geri açmak için alttaki satırı yorumdan çıkarın
       ve admin-layout.component.ts'deki imports dizisine HuBreadcrumb ekleyin. -->
  <!-- <hu-breadcrumb class="page-breadcrumb" [items]="breadcrumb()" /> -->
  <router-outlet />
</hu-shell>
