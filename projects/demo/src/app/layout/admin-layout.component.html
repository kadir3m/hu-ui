<hu-shell [nav]="nav" brand="@ucme-ui/angular" brandSubtitle="Dokümantasyon">
  <hu-breadcrumb huTopbarStart class="topbar-breadcrumb" [items]="breadcrumb()" />

  <div huTopbarEnd>
    <div class="topbar-search">
      <hu-icon name="search" [size]="16" />
      <input huInput size="sm" type="search" placeholder="Ara…" aria-label="Uygulamada ara" />
      <kbd>Ctrl K</kbd>
    </div>

    <hu-theme-toggle />

    <!-- Özel tetikleyici (okunmamış noktası) + panel başlığı -->
    <hu-dropdown class="notifications" align="end" ariaLabel="Bildirimler" [options]="notifications">
      <button huDropdownTrigger hu-button variant="ghost" iconOnly aria-label="Bildirimler" class="notif-trigger">
        <hu-icon name="bell" [size]="18" />
        <span class="notif-dot" aria-hidden="true"></span>
      </button>
      <div huDropdownHeader>
        <strong>Bildirimler</strong>
        <hu-badge variant="primary">{{ notifications.length }} yeni</hu-badge>
      </div>
    </hu-dropdown>

    <!-- Özel tetikleyici (avatar) -->
    <hu-dropdown align="end" ariaLabel="Kullanıcı menüsü" [options]="userMenu" (selected)="onUserMenu($event)">
      <button huDropdownTrigger type="button" class="user-trigger" aria-label="Kullanıcı menüsü">
        <hu-avatar [name]="user.name" size="sm" />
        <span class="user-trigger__text">
          <span class="user-trigger__name">{{ user.name }}</span>
          <span class="user-trigger__role">{{ user.role }}</span>
        </span>
        <hu-icon name="chevron-down" [size]="16" />
      </button>
    </hu-dropdown>
  </div>

  <router-outlet />
</hu-shell>
