name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kütüphaneyi derle
        run: npx ng build hu-ui
      - name: Demo uygulamasını derle
        run: npx ng build demo
      - name: Paket içeriğini göster
        run: npm pack ./dist/hu-ui --dry-run
